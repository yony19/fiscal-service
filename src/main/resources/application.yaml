server:
  port: 8087

spring:
  application:
    name: fiscal-service
  servlet:
    multipart:
      enabled: true
      # .pfx files are usually 4-10 KB. 10 MB cap is generous + safe.
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fiscal}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
          max-wait: 500ms
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:claveSegura123}
      timeout: 200ms
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true


logging:
  level:
    '[org.hibernate.SQL]': DEBUG
    '[org.hibernate.type.descriptor.sql]': TRACE

auth-service:
  base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}

fiscal:
  artifacts:
    storage-mode: FILE_SYSTEM
    base-path: ${FISCAL_ARTIFACTS_BASE_PATH:C:/Users/User/Documents/proyecto personal/pointofsale/resources/fiscal}
  # AES-GCM master key for encrypting .pfx passwords at rest. MUST be set in
  # production via env var; the default is for local dev only and is rotated
  # on every fresh DB. Use any 32+ char random string (32 bytes encoded base64
  # is preferred). The key is hashed to derive the actual AES key, so length
  # is the only constraint.
  security:
    cert-password-master-key: ${FISCAL_CERT_MASTER_KEY:dev-only-change-me-in-production-please-32+chars}
  retry:
    delay-ms: ${FISCAL_RETRY_DELAY_MS:60000}
    batch-size: ${FISCAL_RETRY_BATCH_SIZE:50}
