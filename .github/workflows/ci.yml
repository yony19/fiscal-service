# CI del servicio: build + tests unitarios + escaneo de secretos.
# Ola 2 (E2.x): convierte los tests en un gate real en cada push/PR y agrega
# deteccion de secretos (gitleaks) para que no se vuelva a commitear una llave
# (ver PRD #0 / incidente de credenciales AWS).
#
# Los tests de carga de contexto Spring (*ApplicationTests) se EXCLUYEN aqui
# porque requieren infraestructura (Postgres/Kafka). Cuando se agregue
# Testcontainers, correrlos en un job de integracion aparte.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build y tests unitarios (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y correr tests unitarios
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test -Dtest='!*ApplicationTests' -DfailIfNoTests=false

  secret-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
